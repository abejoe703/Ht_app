<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>HT Online</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding-top: 50px; }
        #btnTalk { 
            padding: 20px 40px; 
            font-size: 24px; 
            background-color: red; 
            color: white; 
            border: none; 
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>HT Online</h1>
    
    <!-- Ini tombolnya -->
    <button id="btnTalk">Tekan untuk Bicara</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const btn = document.getElementById('btnTalk');

        btn.addEventListener('mousedown', () => {
            btn.style.backgroundColor = 'green';
            console.log('Mulai bicara...');
        });

        btn.addEventListener('mouseup', () => {
            btn.style.backgroundColor = 'red';
            console.log('Selesai bicara.');
        });
    </script>
</body>
</html>

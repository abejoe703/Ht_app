<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0b1120"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>AbeJoe HT</title>


    <!-- =================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="/css/ht.css"
    >

</head>


<body>


<!-- =====================================================
     RADIO
====================================================== -->

<div class="radio">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="top">

        <div class="logo">
            📻 ABEJOE HT
        </div>

        <div class="subtitle">
            CLOUD RADIO COMMUNICATION
        </div>


        <div
            id="status"
            class="status offline"
        >
            🔴 SERVER OFFLINE
        </div>

    </header>


    <!-- =================================================
         SETTINGS
    ================================================== -->

    <section class="settings">


        <div class="field">

            <label for="callsign">
                CALLSIGN
            </label>

            <input
                id="callsign"
                type="text"
                value="ABEJOE"
                maxlength="20"
                autocomplete="off"
                spellcheck="false"
            >

        </div>


        <div class="field">

            <label for="channel">
                CHANNEL
            </label>

            <input
                id="channel"
                type="text"
                value="1"
                maxlength="20"
                autocomplete="off"
                inputmode="numeric"
            >

        </div>


    </section>


    <!-- =================================================
         RADIO SCREEN
    ================================================== -->

    <section
        class="radio-screen"
        aria-label="Radio communication"
    >


        <div class="screen-header">

            <span>
                CHANNEL
                <b id="channelDisplay">
                    1
                </b>
            </span>


            <span>
                <span id="users">
                    0
                </span>

                USERS
            </span>

        </div>


        <div id="log"></div>


    </section>


    <!-- =================================================
         TX / RX
    ================================================== -->

    <div
        id="radioState"
        class="radio-state"
    >
        STANDBY
    </div>


    <!-- =================================================
         PTT
    ================================================== -->

    <button
        id="ptt"
        class="ptt"
        type="button"
        aria-label="Push to talk"
    >
        PTT
    </button>


    <!-- =================================================
         CONTROLS
    ================================================== -->

    <div class="bottom">


        <button
            id="connectBtn"
            class="btn"
            type="button"
        >
            📡 CONNECT
        </button>


        <button
            id="disconnectBtn"
            class="btn"
            type="button"
        >
            ⛔ DISCONNECT
        </button>


    </div>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <div class="users">
        WebRTC Voice • Cloudflare • AbeJoe
    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    src="/js/ht-client.js"
    defer
></script>


</body>

</html>
